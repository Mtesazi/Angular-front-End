<div class="col-md-6 offset-md-3">
<h3> Create Employee</h3>
<form (ngSubmit) = "onSubmit()">
<div class = "form-group">
 <label> First Name</label>
 <input type ="text" class ="form-control" id ="firstName" [(ngModel)] = "employee.firstName" name="firstName">
</div>
<div class = "form-group">
    <label>Last Name</label>
    <input type ="text" class ="form-control" id ="lastName" [(ngModel)] = "employee.lastName" name="lastName">
   </div>
   <div class = "form-group">
    <label> Email Address</label>
    <input type ="text" class ="form-control" id ="emailAddress" [(ngModel)] = "employee.emailAddress" name="emailAddress">
   </div>
   <div class = "form-group">
    <label> Contact Number</label>
    <input type ="text" class ="form-control" id ="contactNumber" [(ngModel)] = "employee.contactNumber" name="contactNumber">
   </div>
   <div class="form-group">
    <button class="btn btn-success" type="submit">Submit</button> 
   </div>               
</form>
</div>
